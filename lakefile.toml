name = "Atlas"
version = "0.1.0"
defaultTargets = ["Atlas"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "8a178386ffc0f5fef0b77738bb5449d50efeea95"

[[lean_lib]]
name = "Atlas"
globs = ["Atlas.+"]

[[lean_lib]]
name = "Unproved"

# Kernel-grounded sorry/axiom auditor. Its root imports only `Lean`, so
# `lake build atlas_audit` compiles without building Mathlib or Atlas; the
# Atlas library is loaded at runtime (`lake exe atlas_audit`) to be audited.
[[lean_exe]]
name = "atlas_audit"
root = "Audit.Audit"
