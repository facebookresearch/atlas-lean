name = "CPythonListsort"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Code"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
linter.style.header = false # Preserve the imported development-source headers.
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Code"
