name: Mathlib linters

# Mathlib's linters, reported on the code that a pull request adds, so that
# existing code never shows up:
# - the warnings of every linter that the build runs: Mathlib's standard set,
#   which lakefile.toml turns on for the production libraries, and the linters
#   that Lean, Batteries and Mathlib turn on by default; and the deprecation
#   warnings (scripts/check_syntax_linters.py);
# - the environment linters of `#lint` on the declarations the pull request
#   adds (scripts/check_env_linters.py);
# - the text-based `lint-style` linters (scripts/check_text_linters.py).
# The job is advisory: a finding annotates its line and the job summary, and
# only a check that cannot run fails it. It builds the changed files once, on
# top of the build that ci.yml saves from main, and the three checks share that
# build. It stays out of ci.yml, so a change here never makes a pull request's
# required checks stale.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The Lean sources of the production libraries, and this job's own code.
    paths:
      - "MathlibExt/**.lean"
      - "CSLibExt/**.lean"
      - "PhyslibExt/**.lean"
      - "Domains/**.lean"
      - "WantedExt/**.lean"
      - ".github/workflows/linters.yml"
      - "scripts/lean_changes.py"
      - "scripts/check_*_linters.py"
      - "scripts/linters_self_test.py"
      - "scripts/test_lean_changes.py"
      - "scripts/test_check_*_linters.py"
      - "scripts/bump/pinned_bump.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: mathlib linters
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The test merge and its first parent, the commit it is tested against.
          fetch-depth: 2

      - name: Test the checks
        run: |
          set -euo pipefail
          # The fixtures' findings must not reach this job's summary.
          unset GITHUB_STEP_SUMMARY
          for tests in test_lean_changes.py test_check_syntax_linters.py \
              test_check_env_linters.py test_check_text_linters.py; do
            python3 -m unittest discover -s scripts -p "$tests"
          done

      # A pull request that changes the toolchain or the manifest has no build
      # to restore, so its Lean files are linted by the pull requests after it.
      # One that changes the checks also runs them end to end on a probe module,
      # which needs only Mathlib's cache.
      - name: Decide what to run
        id: scope
        run: |
          set -euo pipefail
          lint=true
          if ! git diff --quiet HEAD^1 HEAD -- lean-toolchain lake-manifest.json; then
            echo "This pull request changes the toolchain or the manifest; nothing is linted."
            lint=false
          elif git diff --quiet HEAD^1 HEAD -- 'MathlibExt/*.lean' 'CSLibExt/*.lean' \
              'PhyslibExt/*.lean' 'Domains/*.lean' 'WantedExt/*.lean'; then
            echo "This pull request changes no Lean file of the production libraries."
            lint=false
          fi
          self_test=false
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows/linters.yml scripts/lean_changes.py \
              'scripts/check_*_linters.py' scripts/linters_self_test.py scripts/bump/pinned_bump.py; then
            self_test=true
          fi
          setup=false
          if [[ "$lint" == true || "$self_test" == true ]]; then setup=true; fi
          {
            echo "lint=$lint"
            echo "self_test=$self_test"
            echo "setup=$setup"
          } >> "$GITHUB_OUTPUT"

      # As in ci.yml: the restored build and the caches need the space.
      - name: Free disk space for Lean caches
        if: steps.scope.outputs.setup == 'true'
        run: |
          set -euo pipefail
          df -h / || true
          free_kib="$(df --output=avail -k / | awk 'NR == 2 && NF == 1 && $1 ~ /^[0-9]+$/ { print $1 }')" || free_kib=""
          if [[ -z "$free_kib" ]] || (( 10#$free_kib < 60 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
            df -h / || true
          fi

      - name: Install elan v4.2.4
        if: steps.scope.outputs.setup == 'true'
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        if: steps.scope.outputs.setup == 'true'
        run: lake exe cache get

      # The builds that ci.yml saves from main, so that only the changed files
      # and the modules that main has not built yet are built here. The probe
      # module of the self-test imports only Mathlib, and needs neither.
      - name: Restore package builds
        if: steps.scope.outputs.lint == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/cslib/.lake/build
            .lake/packages/Physlib/.lake/build
          key: lake-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Find the base commit
        id: base
        if: steps.scope.outputs.lint == 'true'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Restore local build
        if: steps.scope.outputs.lint == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build the changed files
        id: build
        if: steps.scope.outputs.lint == 'true'
        run: python3 scripts/lean_changes.py build --base HEAD^1

      - name: Report linter and deprecation warnings on added lines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/check_syntax_linters.py --base HEAD^1 --report-only

      - name: Report environment-linter findings on added declarations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/check_env_linters.py --base HEAD^1 --report-only

      - name: Report text-lint errors on added lines
        if: ${{ !cancelled() && steps.scope.outputs.lint == 'true' }}
        run: python3 scripts/check_text_linters.py --base HEAD^1 --report-only

      - name: Check the checks end to end
        if: ${{ !cancelled() && steps.scope.outputs.self_test == 'true' }}
        # As for the unit tests: the probe's findings must not reach this job's summary.
        run: env -u GITHUB_STEP_SUMMARY python3 scripts/linters_self_test.py
