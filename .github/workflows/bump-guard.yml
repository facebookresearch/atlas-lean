name: Bump guard

# Validate any PR that touches the Lean/Mathlib pin files. Runs on
# pull_request_target so the guard script is always the trusted base
# version, never PR-modified code; it reads the PR's pin files as data
# via the API and runs no PR code. Fails the PR when the pin change is
# not a forward move to a single final release tag shared by every
# pinned dependency, with a manifest exactly derived from those tags.
# Runs for every PR (no paths filter: path filtering only considers a
# bounded file list) and on `edited` (a base retarget emits `edited`,
# not `synchronize`, and must revalidate against the new base).
# See scripts/bump/pinned_bump.py (guard).
#
# Base advance: a pull_request_target run does NOT rerun when the base
# branch advances, so a still-green guard can go stale (two bump PRs
# pass against the same base; the older one merges after the newer and
# downgrades the pins). This workflow therefore also runs on
# merge_group, revalidating the PR against the merge group's current
# base before it can merge via the merge queue. The merge-group run
# checks out the merge group's base SHA, so the guard script it runs
# is trusted base code, not merge-group tree code. This only helps
# when the repo uses the merge queue for these PRs; a repo merging
# directly should additionally enable "Require branches to be up to
# date before merging" in branch protection.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# github.ref is the base ref under pull_request_target, and the merge
# group ref under merge_group, so key the concurrency group by PR
# number / merge-group head ref: one PR's activity must not cancel
# another PR's guard run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Trusted base code only: the PR's base ref under
      # pull_request_target, the merge group's base SHA under
      # merge_group. Never check out the PR / merge-group tree here:
      # that tree can contain PR-modified guard code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Validate pin change against base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/guard/base /tmp/guard/merge-base /tmp/guard/pr
          # The guard reads the configured pin-policy file from both trees,
          # so download it too (from the base checkout's config: a PR cannot
          # change the config, it is a guard file).
          PIN_POLICY_PATH="$(python3 -c 'import json; c = json.load(open("scripts/bump/pinned_deps.json")); print((c.get("pin_policy") or {}).get("path", ""))')"
          # The guard validates the pin-coupled migration ledgers, so
          # download them too for every tree; a tree that predates them
          # (contents API 404) legitimately has no ledger files.
          LEDGER_PATHS="$(python3 -c 'import json; c = json.load(open("scripts/bump/pinned_deps.json")); print(" ".join(c.get("migration_ledgers") or []))')"
          # Doc files carrying configured pin replacements (README.md):
          # the guard validates them against the base tree with the new
          # tag applied, so they must be downloaded for every tree too.
          # Unique paths, in config order. Downloaded as optional
          # (404-tolerated) like the ledgers: the guard itself fails
          # closed when a doc file is missing from the PR tree or
          # present there but absent from the base tree.
          DOC_PATHS="$(python3 -c 'import json; c = json.load(open("scripts/bump/pinned_deps.json")); seen = []; [seen.append(e["path"]) for e in c.get("doc_replacements") or [] if e["path"] not in seen]; print(" ".join(seen))')"
          if [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_REF="$MERGE_GROUP_BASE_SHA"
            HEAD_SHA="$MERGE_GROUP_HEAD_SHA"
          else
            BASE_REF="$PR_BASE_REF"
            HEAD_SHA="$PR_HEAD_SHA"
          fi
          MERGE_BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          # Download one file into one guard tree. Required files fail
          # closed on any API error; ledger files tolerate a 404
          # (the tree predates the ledgers) and fail on any other error.
          download_one() {
            _dir="$1"; _ref="$2"; _file="$3"; _required="$4"
            mkdir -p "/tmp/guard/${_dir}/$(dirname "$_file")"
            _err="$(mktemp)"
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${_file}?ref=${_ref}" --jq '.content' 2>"$_err" | base64 -d > "/tmp/guard/${_dir}/${_file}"; then
              rm -f "$_err"
              return 0
            fi
            if [ "$_required" = "false" ] && grep -qi "404\|not found" "$_err"; then
              rm -f "$_err" "/tmp/guard/${_dir}/${_file}"
              return 0
            fi
            cat "$_err" >&2
            rm -f "$_err"
            return 1
          }
          for dir in base merge-base pr; do
            case "$dir" in
              base) REF="$BASE_REF" ;;
              merge-base) REF="$MERGE_BASE_SHA" ;;
              pr) REF="$HEAD_SHA" ;;
            esac
            FILES="lean-toolchain lakefile.toml lake-manifest.json"
            if [ -n "$PIN_POLICY_PATH" ]; then FILES="$FILES $PIN_POLICY_PATH"; fi
            for file in $FILES; do
              download_one "$dir" "$REF" "$file" true
            done
            for file in $LEDGER_PATHS; do
              download_one "$dir" "$REF" "$file" false
            done
            for file in $DOC_PATHS; do
              download_one "$dir" "$REF" "$file" false
            done
          done
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # Merge group: derive the changed-file list from the complete
            # base-to-group diff. A merge group can hold several PRs, so a
            # list taken from the single PR parsed from the head ref would
            # omit pin/guard changes from the other grouped PRs and let the
            # guard validate the combined tree against an incomplete file
            # list. Include previous_filename so renaming a protected file
            # cannot hide its original name. The compare API caps files at
            # 300, so hitting the cap fails closed as possibly truncated.
            gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" \
              --jq '.files[] | .filename' > /tmp/guard/filenames.txt
            ENTRY_COUNT="$(wc -l < /tmp/guard/filenames.txt | tr -d ' ')"
            gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" \
              --jq '.files[] | select(.previous_filename != null) | .previous_filename' >> /tmp/guard/filenames.txt
            if [ "$ENTRY_COUNT" -ge 300 ]; then
              echo "::error::changed-file enumeration may be truncated at the compare API cap of 300 files; failing closed."
              exit 1
            fi
          else
            # Paginated REST file list: `gh pr view --json files` caps at 100.
            # Include previous_filename so renaming a protected file (guard
            # workflow/script/config) cannot hide its original name, and
            # fail closed if the entry count disagrees with changed_files.
            EXPECTED_COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[] | .filename' > /tmp/guard/filenames.txt
            ENTRY_COUNT="$(wc -l < /tmp/guard/filenames.txt | tr -d ' ')"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[] | select(.previous_filename != null) | .previous_filename' >> /tmp/guard/filenames.txt
            if [ "$ENTRY_COUNT" != "$EXPECTED_COUNT" ]; then
              echo "::error::changed-file enumeration is incomplete (got $ENTRY_COUNT entries, PR reports $EXPECTED_COUNT); failing closed."
              exit 1
            fi
          fi
          cp /tmp/guard/filenames.txt /tmp/guard/changed.txt
          python3 scripts/bump/pinned_bump.py guard \
            --base /tmp/guard/base \
            --merge-base /tmp/guard/merge-base \
            --pr /tmp/guard/pr \
            --changed-files /tmp/guard/changed.txt
