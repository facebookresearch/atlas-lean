name: Bump guard

# Validate any PR that touches the Lean/Mathlib pin files. Runs on
# pull_request_target so the guard script is always the trusted base
# version, never PR-modified code; it reads the PR's pin files as data
# via the API and runs no PR code. Fails the PR when the pin change is
# neither a forward move to a single final release tag shared by every
# pinned dependency (with a manifest exactly derived from those tags)
# nor a same-pin change (new dependency/library at the current pin, with
# the config extended monotonically in the same PR).
# Runs for every PR (no paths filter: path filtering only considers a
# bounded file list) and on `edited` (a base retarget emits `edited`,
# not `synchronize`, and must revalidate against the new base).
# See scripts/bump/pinned_bump.py (guard).
#
# Base advance: a pull_request_target run does NOT rerun when the base
# branch advances, so a still-green guard can go stale (two bump PRs
# pass against the same base; the older one merges after the newer and
# downgrades the pins). This workflow therefore also runs on
# merge_group, revalidating the PR against the merge group's current
# base before it can merge via the merge queue. The merge-group run
# checks out the merge group's base SHA, so the guard script it runs
# is trusted base code, not merge-group tree code. This only helps
# when the repo uses the merge queue for these PRs; a repo merging
# directly should additionally enable "Require branches to be up to
# date before merging" in branch protection.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# github.ref is the base ref under pull_request_target, and the merge
# group ref under merge_group, so key the concurrency group by PR
# number / merge-group head ref: one PR's activity must not cancel
# another PR's guard run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Trusted base code only: the PR's base ref under
      # pull_request_target, the merge group's base SHA under
      # merge_group. Never check out the PR / merge-group tree here:
      # that tree can contain PR-modified guard code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Validate pin change against base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/guard/base /tmp/guard/merge-base /tmp/guard/pr
          # The guard reads pinned_deps.json from every tree: a same-pin
          # PR may extend the config monotonically (add a dependency at
          # the current pin), and the guard validates that extension
          # against the base config. The config is PR data here, never
          # executed; only the base checkout's guard code runs.
          # The guard reads the configured pin-policy file from both trees,
          # so download it too (from the base checkout's config).
          # Config-derived download paths come from the UNION of the base
          # checkout's config and the downloaded PR config: a same-pin PR
          # may add a doc replacement for a new file or add a pin-policy
          # file, and the guard validates added rules against the PR tree,
          # so those files must be downloaded for every tree. Ledgers stay
          # base-only (the guard requires them unchanged).
          # These reads must never crash on a malformed config: a malformed
          # entry once made `e["path"]` raise here, before the guard ran,
          # blocking every PR including a repair PR. Each read skips
          # malformed entries defensively; the guard itself validates the
          # config schema and fails loudly if it is malformed. (Repairing a
          # malformed base config needs a branch-protection bypass: every
          # guard run fails until the base is fixed.)
          # Config-derived download paths come from the UNION of the base
          # checkout's config and the downloaded PR config: a same-pin PR
          # may add a doc replacement for a new file or add a pin-policy
          # file, and the guard validates added rules against the PR tree,
          # so those files must be downloaded for every tree. Ledgers stay
          # base-only (the guard requires them unchanged). The subcommand
          # reads defensively (malformed entries skipped); the guard
          # itself validates the schema and fails loudly if it is malformed.
          config_paths() {
            python3 scripts/bump/pinned_bump.py config-paths --kind "$1" \
              --pr-config /tmp/guard/pr/scripts/bump/pinned_deps.json
          }
          if [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_REF="$MERGE_GROUP_BASE_SHA"
            HEAD_SHA="$MERGE_GROUP_HEAD_SHA"
          else
            BASE_REF="$PR_BASE_REF"
            HEAD_SHA="$PR_HEAD_SHA"
          fi
          MERGE_BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          # Download one file into one guard tree. Required files fail
          # closed on any API error; ledger files tolerate a 404
          # (the tree predates the ledgers) and fail on any other error.
          download_one() {
            _dir="$1"; _ref="$2"; _file="$3"; _required="$4"
            # Containment: the resolved destination must stay beneath
            # its guard-tree root. A PR-controlled path with .. segments
            # must never redirect a download outside the tree -- in
            # particular over the trusted checkout's guard script, which
            # this workflow executes below under pull_request_target.
            # Checked BEFORE mkdir, so traversal cannot create dirs either.
            _dest="$(realpath -m "/tmp/guard/${_dir}/${_file}")"
            case "$_dest" in
              "/tmp/guard/${_dir}"/*) ;;
              *)
                echo "::error::refusing to download ${_file}: destination ${_dest} escapes /tmp/guard/${_dir}" >&2
                return 1
                ;;
            esac
            mkdir -p "$(dirname "$_dest")"
            _err="$(mktemp)"
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${_file}?ref=${_ref}" --jq '.content' 2>"$_err" | base64 -d > "$_dest"; then
              rm -f "$_err"
              return 0
            fi
            if [ "$_required" = "false" ] && grep -qi "404\|not found" "$_err"; then
              rm -f "$_err" "$_dest"
              return 0
            fi
            cat "$_err" >&2
            rm -f "$_err"
            return 1
          }
          # Pass 1: pin files + configs for every tree.
          for dir in base merge-base pr; do
            case "$dir" in
              base) REF="$BASE_REF" ;;
              merge-base) REF="$MERGE_BASE_SHA" ;;
              pr) REF="$HEAD_SHA" ;;
            esac
            for file in lean-toolchain lakefile.toml lake-manifest.json; do
              download_one "$dir" "$REF" "$file" true
            done
            # pinned_deps.json: required from base, 404-tolerated from
            # merge-base/PR. A head or merge base created before the file
            # was introduced must not fail the download: cmd_guard treats
            # a missing unchanged config as the base config, and rejects
            # an actual deletion (config in the changed list, file absent).
            if [ "$dir" = "base" ]; then
              download_one "$dir" "$REF" "scripts/bump/pinned_deps.json" true
            else
              download_one "$dir" "$REF" "scripts/bump/pinned_deps.json" false
            fi
          done
          # Pass 2: config-derived files (union of base + PR configs, so
          # newly configured paths are downloaded too), optional for
          # every tree: the guard fails closed when a needed file is
          # missing from the PR tree or present there but absent from base.
          PIN_POLICY_PATHS="$(config_paths policy)"
          DOC_PATHS="$(config_paths doc)"
          LEDGER_PATHS="$(config_paths ledger)"
          for dir in base merge-base pr; do
            case "$dir" in
              base) REF="$BASE_REF" ;;
              merge-base) REF="$MERGE_BASE_SHA" ;;
              pr) REF="$HEAD_SHA" ;;
            esac
            for file in $PIN_POLICY_PATHS; do
              download_one "$dir" "$REF" "$file" false
            done
            for file in $LEDGER_PATHS; do
              download_one "$dir" "$REF" "$file" false
            done
            for file in $DOC_PATHS; do
              download_one "$dir" "$REF" "$file" false
            done
          done
          # The changed files, from git. The pull request files API lists at
          # most 3,000 files and the compare API 300, so a larger change used
          # to fail closed here. git diff has no cap. Only the two commits'
          # trees are fetched, as data (no blobs, no checkout), so no PR code
          # runs. The diff is from the merge base, as the pull request files
          # list is, and for a merge group it covers every grouped PR, whose
          # merge base with the queue's base is that base. --no-renames lists
          # a renamed file under both names, so renaming a protected file
          # cannot hide its original name.
          git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$MERGE_BASE_SHA" "$HEAD_SHA"
          git -c core.quotePath=false diff --no-renames --name-only "$MERGE_BASE_SHA" "$HEAD_SHA" > /tmp/guard/filenames.txt
          echo "$(wc -l < /tmp/guard/filenames.txt | tr -d ' ') changed files"
          cp /tmp/guard/filenames.txt /tmp/guard/changed.txt
          python3 scripts/bump/pinned_bump.py guard \
            --base /tmp/guard/base \
            --merge-base /tmp/guard/merge-base \
            --pr /tmp/guard/pr \
            --changed-files /tmp/guard/changed.txt
