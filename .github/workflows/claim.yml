name: Claim Atlas task issues

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claim:
    name: answer a task claim
    if: >-
      vars.ATLAS_TASK_CLAIMS == 'true' && github.run_attempt == 1 &&
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: atlas-issue-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted issue scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/claim_task_issue.py
            scripts/frontier_issues.py
          sparse-checkout-cone-mode: false
      - name: Answer the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/claim_task_issue.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"
