name: Blueprint Pages

# PRs that touch the wiki, its tooling, the site or the toolchain pins check
# the graph; every merge group checks it too. main is built once a day and on
# manual runs, not on every push: merges land faster than a build finishes.
# Only the default branch can publish, and publishing is opt-in.
on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC, off the busy top of the hour.
  pull_request:
    paths:
      - "blueprint/**"
      - "scripts/generate_wiki.py"
      - "scripts/sync_wiki.py"
      - "scripts/extract_v2_lean_dependencies.py"
      - "scripts/dump_v2_dependencies.lean"
      - "scripts/extract_mathlib_graph.py"
      - "scripts/dump_mathlib_dependencies.lean"
      - "scripts/check_blueprint_site.py"
      - "scripts/taxonomy.json"
      - "scripts/wiki-sync.json"
      - "scripts/requirements-blueprint.txt"
      - "scripts/test_generate_wiki_navigation.py"
      - "scripts/test_generate_wiki_docstrings.py"
      - "scripts/test_sync_wiki.py"
      - "scripts/test_extract_v2_lean_dependencies.py"
      - "scripts/test_extract_mathlib_graph.py"
      - "scripts/test_check_blueprint_site_navigation.py"
      - "scripts/test_site_chrome.py"
      - "scripts/test_blueprint_workflow.py"
      - "scripts/test_blueprint_taxonomy.py"
      - "mkdocs.yml"
      - "theme/**"
      - "hooks/**"
      - "docs/BLUEPRINT.md"
      - ".github/workflows/blueprint-pages.yml"
      - ".github/autoform-ref"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "lakefile.toml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"

jobs:
  wiki:
    name: build the wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # v1 and Atlas are separate packages. Indexing them with the root package
      # makes declarations ambiguous and would link the wrong Lean source.
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/v1/
            !/Atlas/
          sparse-checkout-cone-mode: false

      - name: Read the reviewed Autoform pin
        run: |
          set -euo pipefail
          ref="$(cat .github/autoform-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Autoform pin" >&2; exit 1; }
          echo "AUTOFORM_REF=$ref" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Test the wiki scripts
        run: >-
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          --with PyYAML==6.0.3
          --with mkdocs==1.6.1
          --with mkdocs-material==9.8.0
          --with mkdocs-literate-nav==0.6.2
          python -m unittest
          scripts.test_generate_wiki_navigation
          scripts.test_generate_wiki_docstrings
          scripts.test_sync_wiki
          scripts.test_extract_v2_lean_dependencies
          scripts.test_extract_mathlib_graph
          scripts.test_check_blueprint_site_navigation
          scripts.test_site_chrome
          scripts.test_blueprint_workflow
          scripts.test_blueprint_taxonomy

      - name: Free disk space for Lean caches
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Add swap for cold Lean builds
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Restore local build
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: blueprint-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            blueprint-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Match ci.yml's cold-runner mitigation for the two heavy production
      # modules. The test-only module is not in the wiki's build surface.
      - name: Build memory-heavy modules one at a time
        run: |
          set -euo pipefail
          lake build MathlibExt.Combinatorics.Enumerative.Nontrivial1234_3412Classes
          lake build MathlibExt.Combinatorics.Words.TernaryAbelianCubeFreeLowerBound

      - name: Build the current v2 libraries
        run: lake build MathlibExt CSLibExt PhyslibExt WantedExt

      # No failed modules or import collisions are silently dropped. Restoring
      # a cache does not waive a successful Lake build of this exact checkout.
      - name: Dump declaration dependencies
        run: |
          set -euo pipefail
          olean_root=.lake/build/lib/lean
          [ -d "$olean_root" ] || olean_root=.lake/build/lib
          : > v2-modules.txt
          while IFS= read -r source; do
            module="${source%.lean}"
            module="${module//\//.}"
            test -f "$olean_root/${source%.lean}.olean" || {
              echo "Missing compiled module: $source" >&2
              exit 1
            }
            echo "$module" >> v2-modules.txt
          done < <(git ls-files 'MathlibExt/*.lean' 'CSLibExt/*.lean' 'PhyslibExt/*.lean' 'WantedExt/*.lean')
          test -s v2-modules.txt
          lake env lean --run scripts/dump_v2_dependencies.lean v2-modules.txt \
            > v2-dependencies.jsonl
          test -s v2-dependencies.jsonl
          gzip -9 v2-dependencies.jsonl

      - name: Collapse dependencies onto the wiki articles
        run: >-
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          python scripts/extract_v2_lean_dependencies.py
          v2-dependencies.jsonl.gz build/lean-dependencies.json

      - name: Add the Lean-owned facts to the articles
        run: >-
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          python scripts/sync_wiki.py lean-facts build/lean-dependencies.json

      - name: Validate the theorem DAG and its declarations
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      - name: Render the blueprint
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint --output site-src --lean-root .
          --require-declarations --ileans .lake/build/lib/lean

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.8.0
          --with mkdocs-literate-nav==0.6.2
          --with pymdown-extensions==11.0.1
          --with markdown==3.10.3
          mkdocs build --strict

      - name: Check routes, anchors, and article cards
        run: python scripts/check_blueprint_site.py site-src site

      - name: Keep dependency diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint-dependencies
          path: |
            build/lean-dependencies.json
            v2-dependencies.jsonl.gz
            v2-modules.txt
          if-no-files-found: warn
          retention-days: 14

      # Keep each successful main build's site for a day, so it can be
      # downloaded or mirrored while GitHub Pages is off.
      - name: Keep the built site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint-site
          path: site
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        if: vars.BLUEPRINT_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Input of the `mathlib` job below, which builds the graph's Mathlib
      # layer and reports a failure here: the site does not read it. It comes
      # after everything the site needs, cannot fail this job, and runs one
      # Lean process over the modules of the dump above, so it needs no more
      # memory than that dump; the timeout, well above its few minutes, keeps
      # a hang from holding this job until its own timeout.
      - name: Dump the v2 declarations with their Mathlib uses
        continue-on-error: true
        timeout-minutes: 30
        run: >-
          python scripts/extract_mathlib_graph.py dump --jobs 1 --shards 1
          --modules v2-modules.txt
          --keep Mathlib,MathlibExt,CSLibExt,PhyslibExt,WantedExt
          mathlib-graph/v2-mathlib-dump.jsonl.gz

      - name: Keep the v2 declarations with their Mathlib uses
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-mathlib-dump
          path: |
            mathlib-graph/v2-mathlib-dump.jsonl.gz
            mathlib-graph/v2-mathlib-dump-meta.json
          if-no-files-found: warn
          retention-days: 14

  # The graph's Mathlib layer (docs/mathlib-layer.md) has its own job and
  # check, so that its failure never holds back the site or its deployment,
  # which do not read it. It uses the v2 extraction and the dump of the v2
  # declarations that the wiki job makes where ATLAS is built; each Mathlib
  # dump shard imports all of Mathlib, about 2.5 GB of its own memory and 7 GB
  # of shared .olean pages.
  mathlib:
    name: build the Mathlib layer
    needs: wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/v1/
            !/Atlas/
          sparse-checkout-cone-mode: false

      - name: Read the reviewed Autoform pin
        run: |
          set -euo pipefail
          ref="$(cat .github/autoform-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Autoform pin" >&2; exit 1; }
          echo "AUTOFORM_REF=$ref" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Free disk space for Lean caches
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Add swap for the Mathlib dump
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Fetch the v2 extraction
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-dependencies

      - name: Fetch the v2 declarations with their Mathlib uses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: v2-mathlib-dump
          path: mathlib-graph

      - name: Dump the Mathlib declarations
        run: >-
          python scripts/extract_mathlib_graph.py dump --jobs 3 --shards 6
          mathlib-graph/mathlib-dump.jsonl.gz

      - name: Extract the Mathlib layer
        run: |
          set -euo pipefail
          test -s mathlib-graph/v2-mathlib-dump.jsonl.gz || {
            echo "The wiki job kept an empty dump of the v2 declarations with their Mathlib uses" >&2
            exit 1
          }
          python scripts/extract_mathlib_graph.py graph mathlib-graph/mathlib-dump.jsonl.gz mathlib-graph
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            python scripts/extract_mathlib_graph.py bridge mathlib-graph/v2-mathlib-dump.jsonl.gz mathlib-graph \
            --mathlib-dump mathlib-graph/mathlib-dump.jsonl.gz --check-v2 build/lean-dependencies.json
          python scripts/extract_mathlib_graph.py join --strict mathlib-graph
          python scripts/extract_mathlib_graph.py stats mathlib-graph
          cp docs/mathlib-layer.md mathlib-graph/SCHEMA.md

      # The dumps are left out: the v2 one is the wiki job's v2-mathlib-dump,
      # and the Mathlib one depends only on the pinned Mathlib.
      - name: Keep the Mathlib layer
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mathlib-graph
          path: |
            mathlib-graph
            !mathlib-graph/*-dump.jsonl.gz
          if-no-files-found: warn
          retention-days: 14

  # No package or Lean code executes in the job with deployment permissions.
  # Repository settings, not a PR, opt the official site into publication.
  deploy:
    needs: wiki
    if: vars.BLUEPRINT_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
