name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  preflight:
    name: repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run deterministic repository checks
        run: scripts/check.sh preflight

      - name: Test v1 metadata inventory
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "${RUNNER_TEMP}/atlas-inventory.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT
          python3 -m venv "$work_dir/venv"
          "$work_dir/venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/requirements-inventory.txt
          "$work_dir/venv/bin/python" -m unittest discover \
            -s scripts -p test_inventory_v1.py -v
          "$work_dir/venv/bin/python" scripts/inventory_v1.py \
            --base HEAD --output "$work_dir/smoke"
          test -s "$work_dir/smoke/inventory.jsonl"
          test -s "$work_dir/smoke/manifest.json"
          "$work_dir/venv/bin/python" -m unittest discover \
            -s scripts -p test_algebra_notes_migration.py -v
          "$work_dir/venv/bin/python" scripts/check_algebra_notes_migration.py \
            --source-revision HEAD

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Lean caches
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Add swap for cold Lean builds
        run: |
          set -euo pipefail
          df -h /mnt
          free -h
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          swapon --show
          free -h

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Restore local build
        id: local-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Each of these peaks at 13-15 GB when built alone. Lake builds several
      # modules at once; on this 16 GB runner the three together exhaust memory
      # and swap until the runner is shut down. Build them first, one at a time;
      # the full build then finds them up to date and replays their logs. When
      # one fails, the full build is skipped: it would retry that module
      # alongside the others.
      - name: Build memory-heavy modules one at a time
        run: |
          set -euo pipefail
          status=0
          for module in \
            MathlibExt.Combinatorics.Enumerative.Nontrivial1234_3412Classes \
            MathlibExt.Combinatorics.Words.TernaryAbelianCubeFreeLowerBound \
            MathlibExtTest.Combinatorics.InfiniteWord.CrochemoreSquarefreeCriterion; do
            lake build "$module" || status=1
          done
          exit "$status"

      - name: Build extension libraries
        run: scripts/check.sh build

      - name: Save local build from main
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.local-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
