name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  preflight:
    name: repository integrity
    # Merge groups run this job, `graph` and `build` on a 16-core runner; see
    # `build`. Here this job took 4.8 minutes, against 6.2 on the standard runner.
    runs-on: ${{ github.event_name == 'merge_group' && '16-core-ubuntu' || 'ubuntu-24.04' }}
    # The import optimizer's subprocess and recovery regressions add several minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # On a pull request, whether it needs the tool tests of scripts/test_scripts.sh,
      # which read only scripts, workflows and the pins (scripts/ci_scope.py). Every
      # other check here runs, and other runs never ask; a failure here runs them.
      - name: Decide whether to run the tool tests
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          # `--` ends the revisions: a file named HEAD must not make them ambiguous.
          git diff-tree -r -z --no-commit-id --name-only HEAD^1 HEAD -- > "$RUNNER_TEMP/changed-paths"
          python3 -I scripts/ci_scope.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"

      - name: Run deterministic repository checks
        env:
          ATLAS_TOOL_TESTS: ${{ (github.event_name == 'pull_request' && steps.scope.outputs.tool_tests == 'false') && 'skip' || 'run' }}
        run: scripts/check.sh preflight

      - name: Test v1 metadata inventory
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "${RUNNER_TEMP}/atlas-inventory.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT
          python3 -m venv "$work_dir/venv"
          "$work_dir/venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/requirements-inventory.txt
          "$work_dir/venv/bin/python" -m unittest discover \
            -s scripts -p test_inventory_v1.py -v
          "$work_dir/venv/bin/python" scripts/inventory_v1.py \
            --base HEAD --output "$work_dir/smoke"
          test -s "$work_dir/smoke/inventory.jsonl"
          test -s "$work_dir/smoke/manifest.json"
          "$work_dir/venv/bin/python" -m unittest discover \
            -s scripts -p test_algebra_notes_migration.py -v
          "$work_dir/venv/bin/python" scripts/check_algebra_notes_migration.py \
            --source-revision HEAD

  # The graph as committed, with no Lean build. The wiki build's own check runs
  # after `lean-facts` has unlinked any stale link, so it cannot catch one.
  graph:
    name: check the graph
    # On a 16-core runner in merge groups, as `build`: 3.2 to 3.5 minutes,
    # against 4.5 to 5.5 on the standard runner.
    runs-on: ${{ github.event_name == 'merge_group' && '16-core-ubuntu' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/v1/
            !/Atlas/
          sparse-checkout-cone-mode: false

      - name: Read the reviewed Autoform pin
        run: |
          set -euo pipefail
          ref="$(cat .github/autoform-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Autoform pin" >&2; exit 1; }
          echo "AUTOFORM_REF=$ref" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Check the declarations and dependencies
        run: >-
          uvx --from "git+https://github.com/facebookresearch/autoform-bot.git@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

  # On a pull request, whether it needs `build` (scripts/ci_scope.py): one that
  # changes only graph data and documentation does not. Other runs skip this
  # job, so that `build` starts without waiting for a runner to run it.
  changes:
    name: decide which checks to run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Check out the merge commit and its base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: /scripts/ci_scope.py
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # `--` ends the revisions: a file named HEAD must not make them ambiguous.
          git diff-tree -r -z --no-commit-id --name-only HEAD^1 HEAD -- > "$RUNNER_TEMP/changed-paths"
          python3 -I scripts/ci_scope.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"

  # A skipped required check counts as passed, so only a pull request can skip
  # `build`, and only when `changes` succeeds and says it needs none. Merge
  # groups, pushes and manual runs always build: `!cancelled()` runs `build`
  # when `changes` is skipped.
  build:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build != 'false') }}
    # A merge group runs on a 16-core runner, pull requests and pushes on the
    # standard one. In probes on 25 November 2026, a merge group's build took
    # about 4 minutes on the 16-core runner against 12.5 on the standard one,
    # and 12 to 14 against 28.5 to 50.5 when main's newest build was 22 to 30
    # merges behind the group's base. The 32- and 64-core runners, whose
    # processors were older, were slower in those cases: the builds waited on
    # fixed costs and on one long module more than on parallel work.
    runs-on: ${{ github.event_name == 'merge_group' && '16-core-ubuntu' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A cold build of the libraries and their dependencies peaks at about
      # 40 GB on this disk. Deleting unused SDKs takes one to three minutes, so
      # do it only when less than 60 GiB is known to be free (the standard
      # runner had 85 GB in November 2026, the 16-core one 794 GB).
      - name: Free disk space for Lean caches
        run: |
          set -euo pipefail
          df -h / || true
          # Unknown free space counts as too little: the second line of the
          # report must be one decimal number.
          free_kib="$(df --output=avail -k / | awk 'NR == 2 && NF == 1 && $1 ~ /^[0-9]+$/ { print $1 }')" || free_kib=""
          if [[ -z "$free_kib" ]] || (( 10#$free_kib < 60 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
            df -h / || true
          fi

      - name: Add swap for cold Lean builds
        run: |
          set -euo pipefail
          df -h /mnt
          free -h
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          swapon --show
          free -h

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      # Upstream packages that the Mathlib cache does not cover. They change only
      # with lake-manifest.json or the toolchain; main's push run saves them.
      - name: Restore package builds
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/cslib/.lake/build
            .lake/packages/Physlib/.lake/build
          key: lake-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # A pull request or merge group first restores the build of the commit it
      # is tested against: the first parent of the commit it checks out. Other
      # runs first look for their own commit. All fall back to main's newest.
      - name: Find the base build
        id: base
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            sha="$(git cat-file -p HEAD | awk '/^parent / && !seen {print $2; seen = 1}')"
          fi
          echo "sha=${sha:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore local build
        id: local-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # A pull request audits only the modules its build rewrites; pushes and
      # merge groups audit everything. The restored build passed the full audit
      # of its own commit, so the scope needs that commit's audit policy.
      - name: Record the restored build for a scoped audit
        if: github.event_name == 'pull_request' && steps.local-build-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        env:
          RESTORED_KEY: ${{ steps.local-build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "${RESTORED_KEY##*-}"
          if python3 scripts/audit_rebuilt_modules.py record "$RUNNER_TEMP/restored-build.json" FETCH_HEAD; then
            echo "ATLAS_AUDIT_RESTORED=$RUNNER_TEMP/restored-build.json" >> "$GITHUB_ENV"
          fi

      # The native tests of the audit tools depend only on the runner image and on
      # the files fingerprinted here: this workflow, which runs them, the pins,
      # every tracked script except JSON data, and the modules
      # test_compiled_audit_native.py builds. The fingerprint holds their modes
      # and the bytes checked out, which the tests run. Pull requests and builds
      # of main always run the tests, and a build of main that passes them saves
      # the fingerprint in main's cache. A merge group with a saved fingerprint
      # skips them. With no image version or no fingerprint, the tests run.
      - name: Fingerprint the audit tools' inputs
        id: audit-tools-inputs
        continue-on-error: true
        run: |
          set -euo pipefail
          [[ -n "${ImageVersion:-}" ]] || exit 0
          specs=(
            .github/workflows/ci.yml lean-toolchain lakefile.toml lake-manifest.json
            scripts ':(exclude,glob)scripts/**/*.json' ':(exclude,glob)scripts/**/*.jsonl'
            MathlibExt/AlgebraicGeometry/ProjHomExtBasicOpen.lean
            MathlibExt/AlgebraicGeometry/SeparatedOpenCover.lean
            MathlibExtTest/AlgebraicGeometry/ProjHomExtBasicOpen.lean
            MathlibExtTest/AlgebraicGeometry/SeparatedOpenCover.lean
          )
          # Any failure leaves no fingerprint, so the tests run.
          digest="$({
            git ls-files --stage -z -- "${specs[@]}" || exit 1
            git ls-files -z -- "${specs[@]}" | xargs -0 -r sha256sum --
          } | sha256sum | cut -d ' ' -f 1)"
          echo "key=audit-tools-tested-${RUNNER_OS}-${ImageVersion}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Look for a build of main that passed the audit tools' tests
        id: audit-tools
        if: github.event_name == 'merge_group' && steps.audit-tools-inputs.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/audit-tools-tested
          key: ${{ steps.audit-tools-inputs.outputs.key }}

      - name: Test the declaration collision check
        if: steps.audit-tools.outputs.cache-hit != 'true'
        run: python3 -m unittest discover -s scripts -p test_declaration_collisions_native.py -v

      # Each of these peaks at 13-15 GB when built alone. Lake builds several
      # modules at once; on the 16 GB standard runner the three together
      # exhaust memory and swap until the runner is shut down. Build them first,
      # one at a time; the full build then finds them up to date and replays
      # their logs. When one fails, the full build is skipped: it would retry
      # that module alongside the others.
      - name: Test initialized compiled-audit isolation
        if: steps.audit-tools.outputs.cache-hit != 'true'
        run: python3 -m unittest discover -s scripts -p test_compiled_audit_native.py -v

      - name: Write the record of the audit tools' tests
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.audit-tools-inputs.outputs.key != ''
        continue-on-error: true
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/audit-tools-tested"

      - name: Save that a build of main passed the audit tools' tests
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.audit-tools-inputs.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/audit-tools-tested
          key: ${{ steps.audit-tools-inputs.outputs.key }}

      - name: Build memory-heavy modules one at a time
        run: |
          set -euo pipefail
          status=0
          for module in \
            MathlibExt.Combinatorics.Enumerative.Nontrivial1234_3412Classes \
            MathlibExt.Combinatorics.Words.TernaryAbelianCubeFreeLowerBound \
            MathlibExtTest.Combinatorics.InfiniteWord.CrochemoreSquarefreeCriterion; do
            lake build "$module" || status=1
          done
          exit "$status"

      # In a merge group, scripts/check.sh stops at its first failing check,
      # so `build` reports the failure without waiting for the checks after
      # it (the compiled audit takes minutes); the queue acts only on check
      # conclusions. Pull requests and pushes run every check, so an author
      # sees every failure in one run.
      - name: Build extension libraries
        env:
          ATLAS_CHECK_FAIL_FAST: ${{ github.event_name == 'merge_group' && '1' || '0' }}
        run: scripts/check.sh build

      - name: Check the bounded codec lesson
        run: lake env lean -DwarningAsError=true docs/teaching/examples/BoundedCodec.lean

      - name: Check the testing-limits lesson
        run: lake env lean -DwarningAsError=true docs/teaching/examples/TestingLimits.lean

      - name: Check the IMP invariant and variant lesson
        run: lake env lean -DwarningAsError=true docs/teaching/examples/IMPInvariants.lean

      # About three quarters of the build's bytes are per-module setup files
      # that Lake writes and reads only while it compiles that module.
      - name: Drop Lake's setup files before saving the build
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        run: find .lake -path '*.lake/build/ir/*' -name '*.setup.json' -delete

      - name: Save local build from main
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.local-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Save package builds from main
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/cslib/.lake/build
            .lake/packages/Physlib/.lake/build
          key: lake-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Merge-group caches are scoped to the queue's ref, where pull requests
      # cannot read them. build-cache.yml saves this fully checked build for
      # main once the queue fast-forwards main to this commit.
      - name: Pack the merge group's build
        id: pack
        if: success() && github.event_name == 'merge_group'
        continue-on-error: true
        run: |
          set -euo pipefail
          tar -C .lake -cf - build | zstd -T0 -q -o "$RUNNER_TEMP/lake-build.tar.zst"

      - name: Upload the merge group's build
        if: success() && steps.pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-build-${{ github.sha }}
          path: ${{ runner.temp }}/lake-build.tar.zst
          retention-days: 1
          compression-level: 0
