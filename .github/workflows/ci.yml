name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  preflight:
    name: repository integrity
    runs-on: ubuntu-24.04
    # The import optimizer's subprocess and recovery regressions add several minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run deterministic repository checks
        run: scripts/check.sh preflight

      - name: Test v1 metadata inventory
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "${RUNNER_TEMP}/atlas-inventory.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT
          python3 -m venv "$work_dir/venv"
          "$work_dir/venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/requirements-inventory.txt
          "$work_dir/venv/bin/python" -m unittest discover \
            -s scripts -p test_inventory_v1.py -v
          "$work_dir/venv/bin/python" scripts/inventory_v1.py \
            --base HEAD --output "$work_dir/smoke"
          test -s "$work_dir/smoke/inventory.jsonl"
          test -s "$work_dir/smoke/manifest.json"
          "$work_dir/venv/bin/python" -m unittest discover \
            -s scripts -p test_algebra_notes_migration.py -v
          "$work_dir/venv/bin/python" scripts/check_algebra_notes_migration.py \
            --source-revision HEAD

  # The graph as committed, with no Lean build. The wiki build's own check runs
  # after `lean-facts` has unlinked any stale link, so it cannot catch one.
  graph:
    name: check the graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/v1/
            !/Atlas/
          sparse-checkout-cone-mode: false

      - name: Read the reviewed Autoform pin
        run: |
          set -euo pipefail
          ref="$(cat .github/autoform-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Autoform pin" >&2; exit 1; }
          echo "AUTOFORM_REF=$ref" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Check the declarations and dependencies
        run: >-
          uvx --from "git+https://github.com/facebookresearch/autoform-bot.git@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Lean caches
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Add swap for cold Lean builds
        run: |
          set -euo pipefail
          df -h /mnt
          free -h
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          swapon --show
          free -h

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      # Upstream packages that the Mathlib cache does not cover. They change only
      # with lake-manifest.json or the toolchain; main's push run saves them.
      - name: Restore package builds
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/cslib/.lake/build
            .lake/packages/Physlib/.lake/build
          key: lake-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # A pull request or merge group first restores the build of the commit it
      # is tested against: the first parent of the commit it checks out. Other
      # runs first look for their own commit. All fall back to main's newest.
      - name: Find the base build
        id: base
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            sha="$(git cat-file -p HEAD | awk '/^parent / && !seen {print $2; seen = 1}')"
          fi
          echo "sha=${sha:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore local build
        id: local-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # A pull request audits only the modules its build rewrites; pushes and
      # merge groups audit everything. The restored build passed the full audit
      # of its own commit, so the scope needs that commit's audit policy.
      - name: Record the restored build for a scoped audit
        if: github.event_name == 'pull_request' && steps.local-build-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        env:
          RESTORED_KEY: ${{ steps.local-build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "${RESTORED_KEY##*-}"
          if python3 scripts/audit_rebuilt_modules.py record "$RUNNER_TEMP/restored-build.json" FETCH_HEAD; then
            echo "ATLAS_AUDIT_RESTORED=$RUNNER_TEMP/restored-build.json" >> "$GITHUB_ENV"
          fi

      - name: Test the declaration collision check
        run: python3 -m unittest discover -s scripts -p test_declaration_collisions_native.py -v

      # Each of these peaks at 13-15 GB when built alone. Lake builds several
      # modules at once; on this 16 GB runner the three together exhaust memory
      # and swap until the runner is shut down. Build them first, one at a time;
      # the full build then finds them up to date and replays their logs. When
      # one fails, the full build is skipped: it would retry that module
      # alongside the others.
      - name: Test initialized compiled-audit isolation
        run: python3 -m unittest discover -s scripts -p test_compiled_audit_native.py -v

      - name: Build memory-heavy modules one at a time
        run: |
          set -euo pipefail
          status=0
          for module in \
            MathlibExt.Combinatorics.Enumerative.Nontrivial1234_3412Classes \
            MathlibExt.Combinatorics.Words.TernaryAbelianCubeFreeLowerBound \
            MathlibExtTest.Combinatorics.InfiniteWord.CrochemoreSquarefreeCriterion; do
            lake build "$module" || status=1
          done
          exit "$status"

      - name: Build extension libraries
        run: scripts/check.sh build

      - name: Check the bounded codec lesson
        run: lake env lean -DwarningAsError=true docs/teaching/examples/BoundedCodec.lean

      - name: Check the testing-limits lesson
        run: lake env lean -DwarningAsError=true docs/teaching/examples/TestingLimits.lean

      - name: Check the IMP invariant and variant lesson
        run: lake env lean -DwarningAsError=true docs/teaching/examples/IMPInvariants.lean

      # About three quarters of the build's bytes are per-module setup files
      # that Lake writes and reads only while it compiles that module.
      - name: Drop Lake's setup files before saving the build
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        run: find .lake -path '*.lake/build/ir/*' -name '*.setup.json' -delete

      - name: Save local build from main
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.local-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Save package builds from main
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/cslib/.lake/build
            .lake/packages/Physlib/.lake/build
          key: lake-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Merge-group caches are scoped to the queue's ref, where pull requests
      # cannot read them. build-cache.yml saves this fully checked build for
      # main once the queue fast-forwards main to this commit.
      - name: Pack the merge group's build
        id: pack
        if: success() && github.event_name == 'merge_group'
        continue-on-error: true
        run: |
          set -euo pipefail
          tar -C .lake -cf - build | zstd -T0 -q -o "$RUNNER_TEMP/lake-build.tar.zst"

      - name: Upload the merge group's build
        if: success() && steps.pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-build-${{ github.sha }}
          path: ${{ runner.temp }}/lake-build.tar.zst
          retention-days: 1
          compression-level: 0
