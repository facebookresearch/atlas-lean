name: Source diagnostics

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Experiment only: a stand-in for a change classifier that says this pull
  # request does not need the job below.
  changes:
    name: decide which checks to run (experiment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lean: ${{ steps.decide.outputs.lean }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            echo "lean=false" >> "$GITHUB_OUTPUT"
          else
            echo "lean=true" >> "$GITHUB_OUTPUT"
          fi

  source-diagnostics:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.lean != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings are advisory. Failed tests, missing inputs, and scan errors
      # fail this job; report-only only relaxes the findings exit status.
      - name: Test and run source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_week2_ci.py -v
          python3 scripts/check_duplicate_defs.py --report-only --require-declarations \
            CSLibExt CSLibExtTest MathlibExt MathlibExtTest PhyslibExt PhyslibExtTest Domains DomainsTest WantedExt
          python3 scripts/check_hypothesis_debt.py --report-only --require-declarations \
            CSLibExt CSLibExtTest MathlibExt MathlibExtTest PhyslibExt PhyslibExtTest Domains DomainsTest WantedExt
