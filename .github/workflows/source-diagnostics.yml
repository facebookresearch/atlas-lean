name: Source diagnostics

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI's repository integrity job runs this test too. Running it in both
      # required workflows means a change that makes one of them skip its jobs
      # (a skipped required check counts as passing) is caught by the other.
      # The test requires its own step to be exactly the workspace check and
      # this command, with no condition.
      - name: Install PyYAML for the merge-queue test
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/merge-queue-venv"
          "$RUNNER_TEMP/merge-queue-venv/bin/python" -m pip install \
            --disable-pip-version-check -r scripts/requirements-inventory.txt

      - name: Test that the required checks report on merge groups
        run: >-
          { changes="$(git status --porcelain --untracked-files=all)"
          && [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && -z "$changes"
          && "$(git config --type=bool --default=false core.sparseCheckout)" == false ]]; }
          || { echo "::error::The workspace is not $GITHUB_SHA"; exit 1; };
          "$RUNNER_TEMP/merge-queue-venv/bin/python" -m unittest discover
          -s scripts -p test_merge_queue_checks.py -v

      # Findings are advisory. Failed tests, missing inputs, and scan errors
      # fail this job; report-only only relaxes the findings exit status. The
      # merge-queue test requires this step to be exactly the workspace check
      # and this command, with no condition.
      - name: Test and run source diagnostics
        id: diagnostics
        shell: bash
        run: >-
          { changes="$(git status --porcelain --untracked-files=all)"
          && [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && -z "$changes"
          && "$(git config --type=bool --default=false core.sparseCheckout)" == false ]]; }
          || { echo "::error::The workspace is not $GITHUB_SHA"; exit 1; };
          scripts/run_source_diagnostics.sh
